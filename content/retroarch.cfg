# RetroArch's configuration on a MUN card. The patched RetroArch includes this
# file from the session's own config (retroarch.c: mun_session_args), which
# then sets the directories under HOME that the card's directory saves watch
# (.mun/saves) and turns config_save_on_exit off.
#
# Keyboard only today: MUN has no controller path for games yet.
#   arrows = D-pad   X = A   Z = B   Enter = Start   Right Shift = Select
#   Escape = quit (exit code 0)      F1 = RetroArch's menu

# Video: SDL2 over the console's KMS/DRM display, OpenGL (software in the dev image).
video_driver = "gl"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_vsync = "true"
video_threaded = "false"
video_shader_enable = "false"

# Audio and input through SDL2; the console sets SDL_AUDIODRIVER=alsa.
audio_driver = "sdl2"
input_driver = "sdl2"
input_joypad_driver = "sdl2"

# Saves live on the card only through MUN's directory saves: states are the
# one thing a core with no battery RAM keeps. Resume where you left off.
savestate_auto_save = "true"
savestate_auto_load = "true"
savestate_thumbnail_enable = "false"
rewind_enable = "false"

# A game ends on its own quit action, the first time (docs/runtime.md).
quit_press_twice = "false"
confirm_on_exit = "false"
pause_nonactive = "false"

# Nothing to remember between sessions, nothing to update, nothing to log.
history_list_enable = "false"
check_firmware_before_loading = "false"
menu_driver = "rgui"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
network_cmd_enable = "false"
log_to_file = "false"
